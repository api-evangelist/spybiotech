name: SpyBiotech
description: 'SpyBiotech is a clinical-stage biotechnology company developing next-generation
  vaccines against infectious diseases and cancer using its proprietary SpyTag/SpyCatcher
  "protein superglue" platform. The technology snaps target antigens onto virus-like
  particles (VLPs) to produce highly immunogenic vaccines with greater ease and speed.
  An Oxford University spinout backed by GV, its pipeline includes candidates such as
  SpyVLP01 targeting human cytomegalovirus (hCMV). This is a company profile in the
  API Evangelist network; SpyBiotech publishes a corporate marketing website but no
  public developer or product API surface.'
